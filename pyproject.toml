[build-system]
requires = ["setuptools>=66.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsetmc-options-platform"
version = "0.1.0"
description = "Phase 1: TSETMC Options Market Tick-Data Platform (1402 SH to present)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.92.0",
    "uvicorn==0.17.6",
    "pydantic==1.10.4",
    "numpy==1.24.2",
    "httpx==0.27.0",
    "duckdb==1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
